<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Привет</title>
  <style>
    /* Простое центрирование и приятный шрифт */
    html,body { height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .wrap {
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, #f7f9fc 0%, #e6eef8 100%);
      color:#0b2545;
      padding:20px;
      box-sizing:border-box;
    }
    .card {
      text-align:center;
      padding:30px 40px;
      border-radius:12px;
      box-shadow: 0 6px 20px rgba(11,37,69,0.08);
    }
    h1 { margin:0; font-size: clamp(20px, 4vw, 36px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Привет, как дела ?</h1>
    </div>
  </div>
</body>
</html>
