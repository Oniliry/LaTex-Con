<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Звездный кликер</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>🚀 Звездный кликер</h1>
    <p>✨ Всего кликов: <span id="totalClicks">0</span></p>
    <p>🌟 Текущее количество звезд: <span id="currentStars">0</span></p>
    <p>⚡ Энергия: <span id="energyValue">0</span></p>

    <div class="energy-bar">
      <div id="energyBar" class="energy-fill"></div>
    </div>

    <div class="star-container">
      <img src="image/moon.png" alt="Планета" id="star" class="star">
    </div>
    
    <p id="message"></p>
    
    <button id="closeBtn">❌ Закрыть</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
